<svg xmlns="http://www.w3.org/2000/svg" viewBox="67.5 -70.4 1356 1356" role="img" aria-labelledby="title desc">
  <title id="title">OpenConvert folder mole</title>
  <desc id="desc">Vector trace of the supplied monoline folder and mole logo.</desc>

  <!--
    NO BACKGROUND PLATE, DELIBERATELY.

    This file used to open with a full-bleed <rect fill="#FCFCFB">, which drew
    the mark as a white tile in the tab strip: wrong on every dark browser
    chrome, and it ate the margin that made the art look small. Transparent is
    the only correct answer for a favicon: the browser paints its own ground.

    Removing the plate costs the contrast the plate was providing, so the ink
    has to follow the browser instead. `prefers-color-scheme` inside an SVG
    favicon is honoured by Chrome, Firefox and Safari, and the fallback (a
    browser that ignores the media query) keeps the light values, which is the
    same mark this file has always drawn.
  -->
  <style>
    :root {
      --ink: #1D1D1F;    /* strokes: mole contour, whiskers, outlines */
      --paper: #FCFCFB;  /* interior fills, i.e. the ground showing through */
      --folder: #5B7E7B; /* the folder contour */
      --snout: #668985;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #EDEDED;
        --paper: #0A0A0A;
        --folder: #6FB3AC;
        --snout: #6FB3AC;
      }
    }
  </style>

  <g id="art">
    <!-- Folder contour traced from the supplied stencil. -->
    <path d="M200 61h390c27 0 48 9 66 31l80 101c13 16 29 22 51 22h504c58 0 105 47 105 105v630c0 58-47 105-105 105H200c-58 0-105-47-105-105V166c0-58 47-105 105-105Z"
          fill="none" stroke="var(--folder)" stroke-width="47" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mole back and head: one uninterrupted source-matched contour. -->
    <path d="M320 1009C317 788 363 604 459 494C532 410 628 366 733 366C867 366 971 434 1018 545C1033 580 1036 617 1048 650C1060 683 1082 704 1119 721"
          fill="none" stroke="var(--ink)" stroke-width="47" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Eye and offset highlight. -->
    <circle cx="710" cy="630" r="63" fill="var(--ink)"/>
    <circle cx="711" cy="619" r="20" fill="var(--paper)"/>

    <!-- Three whiskers on each side, layered behind the snout as in the stencil. -->
    <g fill="none" stroke="var(--ink)" stroke-width="32" stroke-linecap="round">
      <path d="M800 806C757 793 716 790 681 792"/>
      <path d="M806 846C764 854 728 869 696 890"/>
      <path d="M824 879C787 905 757 933 734 958"/>
      <path d="M1133 747C1170 721 1207 703 1241 692"/>
      <path d="M1148 791C1192 789 1231 794 1265 805"/>
      <path d="M1135 836C1173 850 1207 870 1235 893"/>
    </g>

    <!-- Full snout, matching the stencil's tilt and asymmetric oval profile. -->
    <path d="M788 829c29-70 107-126 196-145 78-17 149 2 170 51 22 51-17 116-95 159-81 45-180 55-239 20-37-22-49-52-32-85Z"
          fill="var(--snout)" stroke="var(--ink)" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Two nostrils retained in the original off-centre placement. -->
    <circle cx="997" cy="789" r="19" fill="var(--ink)"/>
    <circle cx="1057" cy="789" r="19" fill="var(--ink)"/>

    <!-- One closed, organic paw drawn from the reference—not a semicircle. -->
    <g id="left-paw" fill="var(--paper)" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M285 1107C286 1033 298 985 333 952C360 927 393 918 430 922C487 928 527 959 545 1004C560 1042 558 1084 545 1118C536 1143 519 1158 499 1156C477 1154 463 1137 455 1111C446 1138 430 1154 410 1156C386 1158 368 1142 359 1113C349 1138 334 1152 315 1150C294 1147 284 1130 285 1107Z"
            stroke-width="43"/>
      <path d="M380 1028C376 1064 368 1094 359 1113M461 1029C459 1067 457 1095 455 1111"
            fill="none" stroke-width="37"/>
    </g>

    <!-- True horizontal mirror of the left paw, preserving opposite handedness. -->
    <g transform="translate(1430 0) scale(-1 1)" fill="var(--paper)" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M285 1107C286 1033 298 985 333 952C360 927 393 918 430 922C487 928 527 959 545 1004C560 1042 558 1084 545 1118C536 1143 519 1158 499 1156C477 1154 463 1137 455 1111C446 1138 430 1154 410 1156C386 1158 368 1142 359 1113C349 1138 334 1152 315 1150C294 1147 284 1130 285 1107Z"
            stroke-width="43"/>
      <path d="M380 1028C376 1064 368 1094 359 1113M461 1029C459 1067 457 1095 455 1111"
            fill="none" stroke-width="37"/>
    </g>
  </g>
</svg>
