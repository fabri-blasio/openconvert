<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenConvert</title>
    <!--
      No <style> block and no inline handler anywhere in this file.
      The app ships under `script-src 'self'; style-src 'self'` with no
      'unsafe-inline', so both would be dropped without an error the user
      could see. Everything arrives as a hashed file from `src/main.ts`.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
