<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenConvert monoline mole app icon</title>
  <desc id="desc">A side-profile mole peeking from a continuous verdigris tunnel.</desc>

  <!-- Quiet square tile; the transparent corners remain platform-mask safe. -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#FAFAFA"/>
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="#D4D4D6" stroke-width="6"/>

  <!-- One complete tunnel. The accent now has a structural meaning. -->
  <circle cx="256" cy="258" r="174" fill="none" stroke="#2F6F6A" stroke-width="34"/>

  <!-- A single back-to-head contour replaces the hat-like nested arcs. -->
  <path d="M145 339C153 235 205 172 286 172c55 0 91 34 105 82 7 23 23 35 47 39"
        fill="none" stroke="#1D1D1F" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M438 293c-21 3-39 14-53 33"
        fill="none" stroke="#1D1D1F" stroke-width="22" stroke-linecap="round"/>

  <!-- Face. -->
  <circle cx="318" cy="248" r="19" fill="#1D1D1F"/>
  <circle cx="324" cy="242" r="6" fill="#FAFAFA"/>
  <ellipse cx="438" cy="294" rx="27" ry="20" transform="rotate(-8 438 294)" fill="#2F6F6A" stroke="#1D1D1F" stroke-width="11"/>
  <ellipse cx="446" cy="289" rx="5" ry="4" fill="#FAFAFA"/>
  <g fill="none" stroke="#1D1D1F" stroke-width="11" stroke-linecap="round">
    <path d="M407 306l33 10M404 318l31 20M405 294l34-2"/>
  </g>

  <!-- Low peeking pose and broad digging paws, retained from the reference. -->
  <path d="M111 409h290" fill="none" stroke="#1D1D1F" stroke-width="28" stroke-linecap="round"/>
  <path d="M148 399v-21c0-23 13-37 32-37s32 14 32 37v21M170 398v-27M192 398v-27"
        fill="none" stroke="#1D1D1F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M287 399v-21c0-23 13-37 32-37s32 14 32 37v21M309 398v-27M331 398v-27"
        fill="none" stroke="#1D1D1F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M146 343c25-17 52-14 73 7M285 351c19-16 42-18 64-8"
        fill="none" stroke="#1D1D1F" stroke-width="15" stroke-linecap="round"/>
</svg>
