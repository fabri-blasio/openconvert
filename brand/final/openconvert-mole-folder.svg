<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OpenConvert mole gripping a folder</title>
  <desc id="desc">The original side-facing monoline mole grips the bottom edge of a minimal outlined folder.</desc>

  <rect x="24" y="24" width="976" height="976" rx="232" fill="#FAFAFA"/>

  <!-- Minimal Windows-style folder: outline only, with a raised left tab. -->
  <path d="M132 792V310c0-27 22-49 49-49h226l77 77h359c27 0 49 22 49 49v405H132Z"
        fill="none" stroke="#2F6F6A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Original Mole 04 back/head gesture, freed from the circular hole. -->
  <path d="M283 691c15-143 77-247 178-290 77-33 168-30 229 10 46 30 72 72 86 130 9 36 29 57 61 67"
        fill="none" stroke="#1D1D1F" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eye: same placement, scale and bright offset highlight as the source. -->
  <circle cx="512" cy="557" r="42" fill="#1D1D1F"/>
  <circle cx="517" cy="547" r="12" fill="#FAFAFA"/>

  <!-- Long side-facing muzzle, retaining the original low sweeping profile. -->
  <path d="M608 677c14-51 60-88 121-101 56-12 105 5 124 37 20 33-1 70-48 95-48 25-108 31-151 13-32-13-53-29-46-44Z"
        fill="#FAFAFA" stroke="#1D1D1F" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M493 639c49-2 88 6 116 25M505 689c38-24 72-34 104-31M516 736c32-29 64-46 97-54"
        fill="none" stroke="#1D1D1F" stroke-width="24" stroke-linecap="round"/>

  <!-- Fully verdigris nose with two nostrils. -->
  <ellipse cx="788" cy="632" rx="53" ry="42" transform="rotate(-8 788 632)"
           fill="#2F6F6A" stroke="#1D1D1F" stroke-width="18"/>
  <ellipse cx="771" cy="635" rx="8" ry="6" transform="rotate(-12 771 635)" fill="#1D1D1F"/>
  <ellipse cx="801" cy="627" rx="8" ry="6" transform="rotate(-12 801 627)" fill="#1D1D1F"/>

  <!-- Three whiskers follow the source's upward, level and downward rhythm. -->
  <g fill="none" stroke="#1D1D1F" stroke-width="16" stroke-linecap="round">
    <path d="M832 615l66-28"/>
    <path d="M838 635l67 2"/>
    <path d="M830 654l59 31"/>
  </g>

  <!-- The original compact three-finger paws now terminate on the folder edge. -->
  <path d="M290 792c2-78 35-119 91-119 55 0 88 42 90 119"
        fill="none" stroke="#1D1D1F" stroke-width="34" stroke-linecap="round"/>
  <path d="M613 792c2-78 35-119 91-119 55 0 88 42 90 119"
        fill="none" stroke="#1D1D1F" stroke-width="34" stroke-linecap="round"/>
  <g fill="none" stroke="#1D1D1F" stroke-width="25" stroke-linecap="round">
    <path d="M340 742l-8 50M382 735l-6 57M424 742l-4 50"/>
    <path d="M663 742l-8 50M705 735l-6 57M747 742l-4 50"/>
  </g>
</svg>
